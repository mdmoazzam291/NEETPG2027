name: GitHub Pages Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/data/high_yield_100 _site/assets
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp assets/app-icon.svg _site/assets/app-icon.svg
          cp assets/app.css _site/assets/app.css
          cp assets/ui-v4.css _site/assets/ui-v4.css
          cp assets/exam-v9.css _site/assets/exam-v9.css
          cp assets/phase13.css _site/assets/phase13.css
          cp assets/app.js _site/assets/app.js
          cp assets/ui-v4-core-compat.js _site/assets/ui-v4-core-compat.js
          cp assets/neetpg-timer.js _site/assets/neetpg-timer.js
          cp assets/supabase-config.js _site/assets/supabase-config.js
          cp assets/phase13-preauth.js _site/assets/phase13-preauth.js
          cp assets/auth-sync.js _site/assets/auth-sync.js
          cp assets/auth-provider-guard.js _site/assets/auth-provider-guard.js
          cp assets/ui-v4.js _site/assets/ui-v4.js
          cp assets/ui-v4-fixes.js _site/assets/ui-v4-fixes.js
          cp assets/exam-v9.js _site/assets/exam-v9.js
          cp assets/phase10-taxonomy.js _site/assets/phase10-taxonomy.js
          cp assets/phase11-analytics.js _site/assets/phase11-analytics.js
          cp assets/phase11-exam-overlay.js _site/assets/phase11-exam-overlay.js
          cp assets/phase12-planning.js _site/assets/phase12-planning.js
          cp assets/phase13-hardening.js _site/assets/phase13-hardening.js
          cp data/high_yield_100/part*.json _site/data/high_yield_100/
          sed -i 's#</head>#<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/ui-v4.css"><link rel="stylesheet" href="assets/exam-v9.css"><link rel="stylesheet" href="assets/phase13.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="assets/supabase-config.js"></script><script src="assets/phase13-preauth.js"></script><script src="assets/ui-v4-core-compat.js"></script><script src="assets/auth-sync.js" defer></script><script src="assets/auth-provider-guard.js" defer></script><script src="assets/neetpg-timer.js" defer></script><script src="assets/ui-v4.js" defer></script><script src="assets/ui-v4-fixes.js" defer></script><script src="assets/exam-v9.js" defer></script><script src="assets/phase10-taxonomy.js" defer></script><script src="assets/phase11-analytics.js" defer></script><script src="assets/phase11-exam-overlay.js" defer></script><script src="assets/phase12-planning.js" defer></script><script src="assets/phase13-hardening.js" defer></script></body>#' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live GitHub Pages app
        env:
          NEETPG2027_LIVE_URL: https://mdmoazzam291.github.io/NEETPG2027/
        run: npx playwright test --config=playwright.live.config.cjs
