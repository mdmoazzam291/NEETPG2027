name: GitHub-only UI v2 Live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-option1-live.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated GitHub-only UI v2
        uses: actions/checkout@v4
        with:
          ref: feature/github-only-ui-v2
      - name: Prepare static site
        run: |
          mkdir -p _site/data/high_yield_100 _site/assets
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp assets/app.css _site/assets/app.css
          cp assets/app.js _site/assets/app.js
          cp data/high_yield_100/part*.json _site/data/high_yield_100/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
