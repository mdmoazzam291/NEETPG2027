name: GitHub-only UI v4 + Phase 9/10/11 Live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-option1-live.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated Phase 11 branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase11-analytics-v2
      - name: Prepare static site
        run: |
          mkdir -p _site/data/high_yield_100 _site/assets
          cp index.html manifest.webmanifest sw.js _site/
          cp assets/app.css assets/ui-v4.css assets/exam-v9.css _site/assets/
          cp assets/app.js assets/ui-v4-core-compat.js assets/neetpg-timer.js assets/supabase-config.js assets/auth-sync.js assets/auth-provider-guard.js assets/ui-v4.js assets/ui-v4-fixes.js assets/exam-v9.js assets/phase10-taxonomy.js assets/phase11-analytics.js _site/assets/
          cp data/high_yield_100/part*.json _site/data/high_yield_100/
          sed -i 's#</head>#<link rel="stylesheet" href="assets/ui-v4.css"><link rel="stylesheet" href="assets/exam-v9.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="assets/supabase-config.js"></script><script src="assets/ui-v4-core-compat.js"></script><script src="assets/auth-sync.js" defer></script><script src="assets/auth-provider-guard.js" defer></script><script src="assets/neetpg-timer.js" defer></script><script src="assets/ui-v4.js" defer></script><script src="assets/ui-v4-fixes.js" defer></script><script src="assets/exam-v9.js" defer></script><script src="assets/phase10-taxonomy.js" defer></script><script src="assets/phase11-analytics.js" defer></script></body>#' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
