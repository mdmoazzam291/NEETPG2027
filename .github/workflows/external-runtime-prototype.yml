name: External Runtime Prototype Test
on:
  push:
    branches: [test/external-render]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Start using Render-equivalent command
        env:
          PORT: '8001'
        run: mkdir -p instance && python -m alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port $PORT > /tmp/external.log 2>&1 &
      - run: |
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8001/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/study | grep -q 'Study session'
