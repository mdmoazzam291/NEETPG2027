services:
  - type: web
    name: neetpg2027-test
    runtime: python
    branch: test/external-render
    buildCommand: python -m pip install -e .
    startCommand: mkdir -p instance && python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
